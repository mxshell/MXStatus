[project]
name = "mxstatus"
version = "0.1.0"
description = "MXStatus is a comprehensive system for monitoring the system status of multiple Linux machines from a centralized server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7,<1",
    "psutil>=5.8.0",
    "puts==0.0.11",
    "pydantic>=2.14.3,<3",
    "requests>=2.34.2,<3",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
