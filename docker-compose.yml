services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: status-server
        restart: unless-stopped
        ports:
            - "5000:5000"
        environment:
            MXSTATUS_ADMIN_TOKEN: "${MXSTATUS_ADMIN_TOKEN:?Set a random admin token of at least 32 characters}"
            MXSTATUS_ADMIN_USER_ID: "${MXSTATUS_ADMIN_USER_ID:-1000}"
            MXSTATUS_REPORT_KEY: "${MXSTATUS_REPORT_KEY:-}"
            MXSTATUS_VIEW_KEY: "${MXSTATUS_VIEW_KEY:-}"
            MXSTATUS_MACHINE_IDS: "${MXSTATUS_MACHINE_IDS:-}"
            MXSTATUS_CORS_ORIGINS: "${MXSTATUS_CORS_ORIGINS:-}"
